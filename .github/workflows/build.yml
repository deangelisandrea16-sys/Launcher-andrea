name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # Firma stabile: usata solo se Andrea ha impostato i Secrets.
      - name: Chiave di firma (se presente)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
            echo "Firma: chiave di release"
          else
            echo "Firma: chiave temporanea (gli aggiornamenti richiedono di disinstallare)"
          fi

      - name: Compila
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Rinomina APK
        run: cp app/build/outputs/apk/release/app-release.apk launcher-andrea.apk

      - uses: actions/upload-artifact@v4
        with:
          name: launcher-andrea
          path: launcher-andrea.apk

      - name: Pubblica Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Launcher v0.1.${{ github.run_number }}
          body: "Scarica launcher-andrea.apk e installalo sul telefono."
          files: launcher-andrea.apk
          make_latest: true

      # Copia pubblica del solo APK (il codice resta privato). Serve il Secret RELEASES_TOKEN.
      - name: Pubblica APK nella repo pubblica
        if: ${{ env.HAS_RELEASES_TOKEN == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          repository: deangelisandrea16-sys/launcher-andrea-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: v0.1.${{ github.run_number }}
          name: Launcher v0.1.${{ github.run_number }}
          body: "Aggiornamento del launcher."
          files: launcher-andrea.apk
          make_latest: true
